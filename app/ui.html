<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>선행특허조사</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Noto Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif;
      }
      body {
        margin: 0;
        padding: 0;
        background: #f5f7fb;
        color: #1f2937;
      }
      .container {
        max-width: 720px;
        margin: 0 auto;
        padding: 24px 16px 48px;
      }
      header {
        margin-bottom: 24px;
      }
      h1 {
        font-size: 1.6rem;
        margin: 0 0 8px;
      }
      p {
        margin: 0;
        line-height: 1.5;
      }
      .card {
        background: #fff;
        border-radius: 16px;
        padding: 20px;
        box-shadow: 0 12px 24px rgba(15, 23, 42, 0.08);
      }
      .upload {
        display: grid;
        gap: 12px;
      }
      input[type="file"] {
        padding: 12px;
        border: 1px dashed #cbd5f5;
        border-radius: 12px;
        background: #f8fafc;
      }
      button {
        padding: 12px 16px;
        border: none;
        border-radius: 12px;
        background: #2563eb;
        color: #fff;
        font-size: 1rem;
        cursor: pointer;
      }
      button:disabled {
        background: #94a3b8;
        cursor: not-allowed;
      }
      .status {
        font-size: 0.9rem;
        color: #475569;
      }
      .results {
        margin-top: 24px;
        display: grid;
        gap: 12px;
      }
      .result-card {
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        padding: 16px;
        background: #fff;
      }
      .result-card h3 {
        margin: 0 0 8px;
        font-size: 1.05rem;
      }
      .tag {
        display: inline-block;
        background: #e0e7ff;
        color: #3730a3;
        border-radius: 999px;
        padding: 4px 10px;
        font-size: 0.8rem;
      }
      @media (max-width: 480px) {
        h1 {
          font-size: 1.4rem;
        }
        .card {
          padding: 16px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>선행특허조사 앱</h1>
        <p>특허 관련 자료를 업로드하면 유사 특허를 찾아드립니다.</p>
      </header>
      <section class="card">
        <form class="upload" id="upload-form">
          <input
            type="file"
            name="file"
            id="file-input"
            accept=".doc,.docx,.pdf,.ppt,.pptx,.xls,.xlsx,.csv,.txt"
            required
          />
          <button type="submit" id="submit-button">검색 시작</button>
          <div class="status" id="status">지원 형식: DOCX, PDF, PPTX, XLSX/CSV, TXT</div>
        </form>
      </section>
      <section class="results" id="results"></section>
    </div>
    <script>
      const form = document.getElementById("upload-form");
      const status = document.getElementById("status");
      const results = document.getElementById("results");
      const submitButton = document.getElementById("submit-button");

      const renderResults = (items) => {
        results.innerHTML = "";
        if (!items.length) {
          results.innerHTML = '<p class="status">유사한 특허를 찾을 수 없습니다.</p>';
          return;
        }
        items.forEach((item) => {
          const card = document.createElement("article");
          card.className = "result-card";
          card.innerHTML = `
            <div class="tag">유사도 ${item.score.toFixed(3)}</div>
            <h3>${item.title}</h3>
            <p>${item.abstract}</p>
            <p><a href="${item.url}" target="_blank" rel="noreferrer">${item.patent_id}</a></p>
          `;
          results.appendChild(card);
        });
      };

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const fileInput = document.getElementById("file-input");
        if (!fileInput.files.length) {
          status.textContent = "파일을 선택하세요.";
          return;
        }
        const formData = new FormData();
        formData.append("file", fileInput.files[0]);
        status.textContent = "분석 중입니다...";
        submitButton.disabled = true;
        try {
          const response = await fetch("/upload", {
            method: "POST",
            body: formData,
          });
          const payload = await response.json();
          if (!response.ok) {
            status.textContent = payload.error || "오류가 발생했습니다.";
            renderResults([]);
          } else {
            status.textContent = "분석 완료!";
            renderResults(payload.results || []);
          }
        } catch (error) {
          status.textContent = "서버 연결에 실패했습니다.";
        } finally {
          submitButton.disabled = false;
        }
      });
    </script>
  </body>
</html>
